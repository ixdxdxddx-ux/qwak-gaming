<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d5dff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#9b50e0" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <!-- Hexagon background -->
  <polygon points="32,3 58,17 58,47 32,61 6,47 6,17" fill="url(#bg)" stroke="#7c6bff" stroke-width="2"/>
  <polygon points="32,10 52,21 52,43 32,54 12,43 12,21" fill="rgba(109,93,255,0.12)" stroke="#7c6bff" stroke-width="0.8"/>
  <!-- Duck body (ellipse) -->
  <ellipse cx="32" cy="38" rx="13" ry="9" fill="#7c6bff" opacity="0.92"/>
  <!-- Duck head (circle) -->
  <circle cx="42" cy="26" r="8" fill="#7c6bff"/>
  <!-- Bill -->
  <ellipse cx="51" cy="27" rx="4" ry="2.5" fill="#00d2a0"/>
  <!-- Eye -->
  <circle cx="44" cy="24" r="1.8" fill="#080912"/>
  <circle cx="44.6" cy="23.4" r="0.6" fill="white"/>
  <!-- Wing detail -->
  <path d="M22 36 Q30 30 38 36" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Tail -->
  <path d="M20 37 Q16 31 20 26" stroke="#9b50e0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Feet -->
  <line x1="28" y1="47" x2="25" y2="52" stroke="#00d2a0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="35" y1="47" x2="32" y2="52" stroke="#00d2a0" stroke-width="1.5" stroke-linecap="round"/>
</svg>