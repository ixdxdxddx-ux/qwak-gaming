<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Игры — QWAK</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
<link rel="stylesheet" href="../css/design.css">
</head>
<body>
<canvas id="bg"></canvas><div id="cur"></div><div id="cur-ring"></div>

<nav class="nav"><div class="nav-i W">
  <a class="brand" href="../index.html"><div class="bmark">Q</div><span class="bname">QWAK</span></a>
  <div class="nlinks" id="navLinks">
    <a class="nl" href="../index.html">Главная</a>
    <a class="nl on" href="games.html">Игры</a>
    <a class="nl" href="forum.html">Форум</a>
    <a class="nl" href="launcher.html">Лаунчер</a>
  </div>
  <div class="nbtns" id="navAuth">
    <button class="btn btn--outline btn--sm" id="loginBtn">Войти</button>
    <button class="btn btn--primary btn--sm" id="regBtn">Регистрация</button>
  </div>
  <button class="burger" id="burgerBtn"><span></span><span></span><span></span></button>
</div></nav>

<main class="page-transition" style="padding-top:52px">
  <div class="W" style="padding-top:40px;padding-bottom:60px">
    <div class="page-header">
      <div class="page-header__row">
        <div>
          <div class="page-header__eyebrow">Каталог</div>
          <h1 class="page-header__title">Игры</h1>
          <p class="page-header__desc">Все игры бесплатны &middot; <span id="gameCount">0</span> игр</p>
        </div>
        <button class="btn bp hidden" id="addGameBtn">+ Добавить игру</button>
      </div>
    </div>

    <div class="search-bar" style="margin-bottom:24px">
      <input id="searchInput" placeholder="Поиск по названию, тегам...">
      <select id="genreFilter"><option value="">Все жанры</option></select>
      <select id="typeFilter">
        <option value="">Все типы</option>
        <option value="exe">EXE / MSI</option>
        <option value="torrent">Torrent</option>
        <option value="folder">Папка</option>
        <option value="archive">Архив</option>
        <option value="iso">ISO</option>
      </select>
    </div>

    <div class="games-grid" id="gamesGrid"></div>
  </div>
</main>

<footer class="footer" style="position:relative;z-index:10">
  <div class="W footer__inner">
    <div class="footer__brand"><div class="bmark">Q</div><span class="footer__name">QWAK</span></div>
    <div class="footer__links"><a href="../index.html">Главная</a><a href="games.html">Игры</a><a href="forum.html">Форум</a><a href="launcher.html">Лаунчер</a></div>
    <div class="footer__copy">2024 QWAK Gaming Portal</div>
  </div>
</footer>

<div id="modalsContainer"></div>
<div class="toast-container" id="toastContainer"></div>
<script src="../js/utils.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/launcher-sync.js"></script>
<script src="../js/games.js"></script>
<script src="../js/forum.js"></script>
<script src="../js/design.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  Auth.init(); LauncherSync.init(); Utils.setActiveNav(); Utils.initBurger();
  let allGames = DB.getGames();
  const buildGenres = () => {
    const sel = document.getElementById('genreFilter');
    const genres = [...new Set(allGames.map(g => g.genre).filter(Boolean))].sort();
    sel.innerHTML = '<option value="">Все жанры</option>';
    genres.forEach(g => { const o = document.createElement('option'); o.value = g; o.textContent = g; sel.appendChild(o); });
  };
  const render = () => {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const gv = document.getElementById('genreFilter').value;
    const ft = document.getElementById('typeFilter').value;
    const filtered = allGames.filter(game => {
      const mq = !q || game.title.toLowerCase().includes(q) || (game.tags||[]).some(t => t.toLowerCase().includes(q));
      const mg = !gv || game.genre === gv;
      const mft = !ft || (game.files||[]).some(f => f.type === ft);
      return mq && mg && mft;
    });
    document.getElementById('gameCount').textContent = filtered.length;
    Games.renderGrid('gamesGrid', filtered);
  };
  buildGenres();
  document.getElementById('searchInput').addEventListener('input', render);
  document.getElementById('genreFilter').addEventListener('change', render);
  document.getElementById('typeFilter').addEventListener('change', render);
  const setupAdmin = () => {
    const btn = document.getElementById('addGameBtn');
    if (Auth.canAdmin()) { btn.classList.remove('hidden'); btn.onclick = () => Games.openAddModal(() => { allGames = DB.getGames(); buildGenres(); render(); }); }
    else btn.classList.add('hidden');
  };
  setupAdmin();
  window.addEventListener('qwak:auth', setupAdmin);
  render();
});
</script>
</body>
</html>
