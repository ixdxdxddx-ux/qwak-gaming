<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Категория — QWAK</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
<link rel="stylesheet" href="../css/design.css">
</head>
<body>
<canvas id="bg"></canvas><div id="cur"></div><div id="cur-ring"></div>
<nav class="nav"><div class="nav-i W">
  <a class="brand" href="../index.html"><div class="bmark">Q</div><span class="bname">QWAK</span></a>
  <div class="nlinks" id="navLinks">
    <a class="nl" href="../index.html">Главная</a><a class="nl" href="games.html">Игры</a>
    <a class="nl on" href="forum.html">Форум</a><a class="nl" href="launcher.html">Лаунчер</a>
  </div>
  <div class="nbtns" id="navAuth">
    <button class="btn btn--outline btn--sm" id="loginBtn">Войти</button>
    <button class="btn btn--primary btn--sm" id="regBtn">Регистрация</button>
  </div>
  <button class="burger" id="burgerBtn"><span></span><span></span><span></span></button>
</div></nav>
<main class="page-transition" style="padding-top:52px">
  <div class="W" style="padding-top:40px;padding-bottom:60px">
    <a href="forum.html" class="btn bw bs" style="margin-bottom:20px;display:inline-flex">← Форум</a>
    <div class="page-header">
      <div class="page-header__row">
        <div id="catHeader"></div>
        <button class="btn bp hidden" id="newThreadBtn">+ Создать тему</button>
      </div>
    </div>
    <div id="threadList"></div>
  </div>
</main>
<footer class="footer" style="position:relative;z-index:10">
  <div class="W footer__inner">
    <div class="footer__brand"><div class="bmark">Q</div><span class="footer__name">QWAK</span></div>
    <div class="footer__links"><a href="../index.html">Главная</a><a href="games.html">Игры</a><a href="forum.html">Форум</a></div>
    <div class="footer__copy">2024 QWAK Gaming Portal</div>
  </div>
</footer>
<div id="modalsContainer"></div><div class="toast-container" id="toastContainer"></div>
<script src="../js/utils.js"></script><script src="../js/storage.js"></script><script src="../js/auth.js"></script>
<script src="../js/launcher-sync.js"></script><script src="../js/games.js"></script><script src="../js/forum.js"></script>
<script src="../js/design.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  Auth.init(); LauncherSync.init(); Utils.setActiveNav(); Utils.initBurger();
  const catId = parseInt(new URLSearchParams(location.search).get('id'));
  const cat = Forum.getCat(catId);
  if (!cat) { document.getElementById('catHeader').innerHTML='<p class="text-muted">Категория не найдена</p>'; return; }
  document.title = cat.name + ' — QWAK';
  document.getElementById('catHeader').innerHTML='<div class="page-header__eyebrow">Форум</div><h1 class="page-header__title">'+cat.name+'</h1><p class="page-header__desc">'+cat.desc+'</p>';
  Forum.renderCatThreads('threadList', catId);
  const setup=()=>{const btn=document.getElementById('newThreadBtn');if(Auth.isLoggedIn()){btn.classList.remove('hidden');btn.onclick=()=>Forum.openNewThreadModal(catId,()=>Forum.renderCatThreads('threadList',catId));}else btn.classList.add('hidden');};
  setup(); window.addEventListener('qwak:auth',()=>{setup();Forum.renderCatThreads('threadList',catId);});
});
</script>
</body>
</html>
