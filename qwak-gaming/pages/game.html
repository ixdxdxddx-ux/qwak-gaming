<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Игра — QWAK</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
<link rel="stylesheet" href="../css/design.css">
</head>
<body>
<canvas id="bg"></canvas><div id="cur"></div><div id="cur-ring"></div>

<nav class="nav"><div class="nav-i W">
  <a class="brand" href="../index.html"><div class="bmark">Q</div><span class="bname">QWAK</span></a>
  <div class="nlinks" id="navLinks">
    <a class="nl" href="../index.html">Главная</a>
    <a class="nl on" href="games.html">Игры</a>
    <a class="nl" href="forum.html">Форум</a>
    <a class="nl" href="launcher.html">Лаунчер</a>
  </div>
  <div class="nbtns" id="navAuth">
    <button class="btn btn--outline btn--sm" id="loginBtn">Войти</button>
    <button class="btn btn--primary btn--sm" id="regBtn">Регистрация</button>
  </div>
  <button class="burger" id="burgerBtn"><span></span><span></span><span></span></button>
</div></nav>

<main class="page-transition" style="padding-top:52px">
  <div class="W" style="padding-top:28px;padding-bottom:60px">
    <a href="games.html" class="btn bw bs" style="margin-bottom:20px;display:inline-flex">← Каталог</a>
    <div id="gameContent"></div>
  </div>
</main>

<footer class="footer" style="position:relative;z-index:10">
  <div class="W footer__inner">
    <div class="footer__brand"><div class="bmark">Q</div><span class="footer__name">QWAK</span></div>
    <div class="footer__links"><a href="../index.html">Главная</a><a href="games.html">Игры</a><a href="forum.html">Форум</a></div>
    <div class="footer__copy">2024 QWAK Gaming Portal</div>
  </div>
</footer>

<div id="modalsContainer"></div>
<div class="toast-container" id="toastContainer"></div>
<script src="../js/utils.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/launcher-sync.js"></script>
<script src="../js/games.js"></script>
<script src="../js/forum.js"></script>
<script src="../js/design.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  Auth.init(); LauncherSync.init(); Utils.setActiveNav(); Utils.initBurger();
  var params = new URLSearchParams(location.search);
  var id = parseInt(params.get('id'));
  var cont = document.getElementById('gameContent');
  if (!id) { cont.innerHTML = '<div class="empty-state"><div class="empty-state__title">Игра не найдена</div></div>'; return; }
  var game = DB.getGameById(id);
  if (!game) { cont.innerHTML = '<div class="empty-state"><div class="empty-state__title">Игра не найдена</div><a href="games.html" class="btn bw bs" style="margin-top:12px">← Назад</a></div>'; return; }
  document.title = game.title + ' — QWAK';
  window._currentGame = game;

  function fmtSize(s) { if (!s) return '—'; if (s > 1e9) return (s/1e9).toFixed(1)+' GB'; if (s > 1e6) return Math.round(s/1e6)+' MB'; return Math.round(s/1e3)+' KB'; }
  function stars(r) { var f=Math.round(r/2); return '★'.repeat(f)+'☆'.repeat(5-f); }

  // Cover
  var coverDiv = document.createElement('div');
  coverDiv.className = 'game-detail__cover';
  if (game.sid) {
    var img = document.createElement('img');
    img.src = 'https://cdn.cloudflare.steamstatic.com/steam/apps/'+game.sid+'/capsule_616x353.jpg';
    img.alt = game.title;
    img.onerror = function(){ img.src = 'https://cdn.cloudflare.steamstatic.com/steam/apps/'+game.sid+'/header.jpg'; img.onerror = function(){ coverDiv.style.background='linear-gradient(135deg,#07080c,#121420)'; img.remove(); }; };
    coverDiv.appendChild(img);
  } else {
    coverDiv.style.background = 'linear-gradient(135deg,#07080c,#121420)';
  }
  var overlay = document.createElement('div'); overlay.className = 'game-detail__cover-overlay'; coverDiv.appendChild(overlay);
  var info = document.createElement('div'); info.className = 'game-detail__cover-info';
  var tagsDiv = document.createElement('div'); tagsDiv.className = 'game-detail__tags';
  (game.tags||[]).forEach(function(t){ var s=document.createElement('span'); s.className='tag'; s.textContent=t; tagsDiv.appendChild(s); });
  info.appendChild(tagsDiv);
  var titleH = document.createElement('div'); titleH.className='game-detail__title'; titleH.textContent=game.title; info.appendChild(titleH);
  var devDiv = document.createElement('div'); devDiv.className='game-detail__dev'; devDiv.textContent=(game.dev||'—')+' · '+(game.year||'—'); info.appendChild(devDiv);
  coverDiv.appendChild(info); cont.appendChild(coverDiv);

  // Grid
  var grid = document.createElement('div'); grid.className='game-detail'; cont.appendChild(grid);
  var left = document.createElement('div'); grid.appendChild(left);

  // Desc
  var descCard = document.createElement('div'); descCard.className='glass p-5'; descCard.style.marginBottom='10px';
  descCard.innerHTML='<div style="font-family:\'Syne\',sans-serif;font-size:14px;font-weight:800;color:#fff;margin-bottom:8px">Описание</div><p style="font-size:12px;color:#6a7a94;line-height:1.7">'+(game.desc||'Описание отсутствует.')+'</p>';
  left.appendChild(descCard);

  // Files
  var filesCard = document.createElement('div'); filesCard.className='glass p-5';
  filesCard.innerHTML='<div style="font-family:\'Syne\',sans-serif;font-size:14px;font-weight:800;color:#fff;margin-bottom:12px">Файлы</div>';
  var files = game.files||[];
  if (!files.length) { filesCard.innerHTML+='<div style="font-size:12px;color:#2e3848">Файлы не добавлены</div>'; }
  else { files.forEach(function(f){
    var chip=document.createElement('div'); chip.className='file-chip'; chip.style.marginBottom='7px';
    var icon=document.createElement('span'); icon.className='file-chip__icon'; icon.textContent=Utils.fileIcon(f.type);
    var fi=document.createElement('div'); fi.className='file-chip__info';
    fi.innerHTML='<div class="file-chip__name">'+f.name+'</div><div class="file-chip__meta"><span class="file-chip__type" style="color:'+Utils.fileTypeColor(f.type)+'">'+f.type.toUpperCase()+'</span>'+(f.size?'<span class="file-chip__size">'+fmtSize(f.size)+'</span>':'')+'</div>';
    var btns=document.createElement('div'); btns.style.cssText='display:flex;gap:6px;flex-shrink:0';
    var dl=document.createElement('button'); dl.className='btn bg bs'; dl.textContent='Скачать';
    (function(fn,fs){ dl.onclick=function(){ Games.downloadFile(fn,fs); }; })(f.name,f.size);
    var sc=document.createElement('button'); sc.className='btn bw bs'; sc.textContent='Скан';
    (function(fn){ sc.onclick=function(){ Games.openScanModal(window._currentGame,fn); }; })(f.name);
    btns.appendChild(dl); btns.appendChild(sc);
    chip.appendChild(icon); chip.appendChild(fi); chip.appendChild(btns); filesCard.appendChild(chip);
  }); }
  left.appendChild(filesCard);

  // Sidebar
  var sidebar = document.createElement('div'); sidebar.className='game-detail__sidebar'; grid.appendChild(sidebar);

  var priceCard = document.createElement('div'); priceCard.className='glass p-5';
  priceCard.innerHTML='<div style="font-family:\'Bebas Neue\',sans-serif;font-size:22px;letter-spacing:2px;color:#fff;margin-bottom:3px">БЕСПЛАТНО</div><div style="font-size:10px;color:#2e3848;font-weight:600;margin-bottom:14px">'+(game.size||'—')+' · '+files.length+' файл(ов)</div>';
  var dlBtn=document.createElement('button'); dlBtn.className='btn bp bfull'; dlBtn.style.marginBottom='8px'; dlBtn.textContent='Скачать';
  dlBtn.onclick=function(){ if(files.length===1) Games.downloadFile(files[0].name,files[0].size); else if(files.length>1) Utils.toast('Выберите файл ниже'); else Utils.toast('Файлы недоступны','err'); };
  var scanBtn=document.createElement('button'); scanBtn.className='btn bw bfull'; scanBtn.textContent='Проверить на вирусы';
  scanBtn.onclick=function(){ Games.openScanModal(window._currentGame); };
  var adminDiv=document.createElement('div'); adminDiv.id='adminActions';
  priceCard.appendChild(dlBtn); priceCard.appendChild(scanBtn); priceCard.appendChild(adminDiv); sidebar.appendChild(priceCard);

  var ratingCard=document.createElement('div'); ratingCard.className='glass'; ratingCard.style.padding='14px';
  ratingCard.innerHTML='<div style="font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#252d3a;margin-bottom:4px">Рейтинг</div><div style="font-family:\'Bebas Neue\',sans-serif;font-size:28px;letter-spacing:2px;color:#fff">'+game.rating+'<span style="font-size:13px;color:#2e3848">/10</span></div><div style="color:#888;font-size:13px">'+stars(game.rating)+'</div>';
  sidebar.appendChild(ratingCard);

  var infoCard=document.createElement('div'); infoCard.className='glass'; infoCard.style.padding='14px';
  [['Разработчик',game.dev||'—'],['Жанр',game.genre||'—'],['Год',game.year||'—'],['Добавил',game.addedBy||'—']].forEach(function(row){
    var d=document.createElement('div'); d.style.cssText='display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:11px';
    d.innerHTML='<span style="color:#252d3a;font-weight:600;letter-spacing:.3px">'+row[0]+'</span><span style="color:#8899bb;text-align:right;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+row[1]+'</span>';
    infoCard.appendChild(d);
  });
  sidebar.appendChild(infoCard);

  function setupAdmin(){
    adminDiv.innerHTML='';
    if(Auth.canAdmin()){
      var delBtn=document.createElement('button'); delBtn.className='btn bd bfull'; delBtn.style.marginTop='8px'; delBtn.textContent='Удалить игру';
      delBtn.onclick=function(){ Utils.confirm('Удалить "'+game.title+'"?').then(function(ok){ if(ok){ DB.deleteGame(game.id); Utils.toast('Игра удалена'); location.href='games.html'; } }); };
      adminDiv.appendChild(delBtn);
    }
  }
  setupAdmin(); window.addEventListener('qwak:auth', setupAdmin);
});
</script>
</body>
</html>
