<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тема — QWAK</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
<link rel="stylesheet" href="../css/design.css">
</head>
<body>
<canvas id="bg"></canvas><div id="cur"></div><div id="cur-ring"></div>
<nav class="nav"><div class="nav-i W">
  <a class="brand" href="../index.html"><div class="bmark">Q</div><span class="bname">QWAK</span></a>
  <div class="nlinks" id="navLinks">
    <a class="nl" href="../index.html">Главная</a><a class="nl" href="games.html">Игры</a>
    <a class="nl on" href="forum.html">Форум</a><a class="nl" href="launcher.html">Лаунчер</a>
  </div>
  <div class="nbtns" id="navAuth">
    <button class="btn btn--outline btn--sm" id="loginBtn">Войти</button>
    <button class="btn btn--primary btn--sm" id="regBtn">Регистрация</button>
  </div>
  <button class="burger" id="burgerBtn"><span></span><span></span><span></span></button>
</div></nav>
<main class="page-transition" style="padding-top:52px">
  <div class="Wm" style="padding-top:28px;padding-bottom:60px">
    <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap">
      <a href="forum.html" class="btn bw bs">← Форум</a>
      <span id="catBreadcrumb"></span>
    </div>
    <div id="threadHeader"></div>
    <div id="postsList" style="margin-bottom:16px"></div>
    <div id="replySection"></div>
  </div>
</main>
<footer class="footer" style="position:relative;z-index:10">
  <div class="W footer__inner">
    <div class="footer__brand"><div class="bmark">Q</div><span class="footer__name">QWAK</span></div>
    <div class="footer__links"><a href="../index.html">Главная</a><a href="games.html">Игры</a><a href="forum.html">Форум</a></div>
    <div class="footer__copy">2024 QWAK Gaming Portal</div>
  </div>
</footer>
<div id="modalsContainer"></div><div class="toast-container" id="toastContainer"></div>
<script src="../js/utils.js"></script><script src="../js/storage.js"></script><script src="../js/auth.js"></script>
<script src="../js/launcher-sync.js"></script><script src="../js/games.js"></script><script src="../js/forum.js"></script>
<script src="../js/design.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  Auth.init(); LauncherSync.init(); Utils.setActiveNav(); Utils.initBurger();
  const tid = parseInt(new URLSearchParams(location.search).get('id'));
  const thread = DB.getThreadById(tid);
  if (!thread) { document.getElementById('threadHeader').innerHTML='<div class="empty-state"><div class="empty-state__title">Тема не найдена</div></div>'; return; }
  document.title = thread.title + ' — QWAK';
  const cat = Forum.getCat(thread.catId);
  if (cat) document.getElementById('catBreadcrumb').innerHTML='<a href="cat.html?id='+thread.catId+'" class="btn bw bs">'+cat.name+'</a>';
  document.getElementById('threadHeader').innerHTML='<h1 style="font-family:\'Bebas Neue\',sans-serif;font-size:clamp(22px,4vw,36px);letter-spacing:3px;color:#fff;margin-bottom:6px">'+(thread.locked?'[LOCKED] ':'')+thread.title+'</h1><p style="font-size:10px;color:#252d3a;font-weight:600;margin-bottom:24px">'+thread.author+' · '+thread.date+'</p>';
  Forum.renderPosts('postsList', tid);
  const renderReply=()=>{
    const sec=document.getElementById('replySection');
    if(thread.locked){sec.innerHTML='<div class="glass" style="padding:14px;text-align:center;font-size:12px;color:#252d3a;font-weight:600;letter-spacing:.3px">ТЕМА ЗАКРЫТА</div>';return;}
    if(!Auth.isLoggedIn()){sec.innerHTML='<div class="glass p-4" style="text-align:center"><span style="font-size:12px;color:#384050">Войдите чтобы ответить</span>&nbsp;<button class="btn bw bs" onclick="Auth.openLoginModal()">Войти</button></div>';return;}
    sec.innerHTML='<div class="glass p-4"><div style="font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#252d3a;margin-bottom:8px">Ваш ответ</div><textarea id="replyText" style="min-height:90px;margin-bottom:8px" placeholder="Написать ответ..."></textarea><button class="btn bp bs" id="replyBtn">Ответить</button></div>';
    document.getElementById('replyBtn').onclick=()=>{const txt=document.getElementById('replyText').value;Forum.submitReply(tid,txt,post=>{document.getElementById('postsList').appendChild(Forum._postEl(post,tid));document.getElementById('replyText').value='';Utils.toast('Ответ опубликован!');});};
  };
  renderReply(); window.addEventListener('qwak:auth',()=>{renderReply();Forum.renderPosts('postsList',tid);});
});
</script>
</body>
</html>
